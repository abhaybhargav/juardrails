name: OpenAI Agents SDK adapters

on:
  push:
    paths:
      - 'integrations/openai-agents/**'
      - '.github/workflows/openai-agents.yml'
  pull_request:
    paths:
      - 'integrations/openai-agents/**'
      - '.github/workflows/openai-agents.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./integrations/openai-agents/python pytest
      - run: python -m pytest integrations/openai-agents/python/tests -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --prefix integrations/openai-agents/typescript
      - run: npm test --prefix integrations/openai-agents/typescript
