apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: juardrails-pod-security
webhooks:
  - name: pod-security.juardrails.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 20
    namespaceSelector:
      matchLabels:
        juardrails.io/admission: enabled
    clientConfig:
      service:
        name: juardrails-admission
        namespace: juardrails-system
        path: /validate
        port: 443
      caBundle: REPLACE_WITH_CA_BUNDLE
    rules:
      - operations: [CREATE, UPDATE]
        apiGroups: [""]
        apiVersions: [v1]
        resources: [pods, pods/ephemeralcontainers]
        scope: Namespaced
